<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Skill、MCP、Plugin 三栏对比信息图</title>
  <desc id="desc">用手机界面容器解释 Skill、MCP、Plugin 的核心问题、主要内容、典型使用者和外部系统连接关系。</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faint"><feFuncA type="table" tableValues="0 0.025"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#26322D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#4F7D68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowOchre" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#A57A28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #24312C; }
      .label { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
      .body { font-size: 18px; font-weight: 500; }
      .small { font-size: 15px; font-weight: 500; fill: #52605A; }
      .hand { fill: none; stroke: #33413B; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .soft-line { fill: none; stroke: #849089; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 3 8; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FAF8F2"/>
  <g opacity="0.20" filter="url(#paper)"><rect x="0" y="0" width="1600" height="900" fill="#F5F1E8"/></g>
  <path d="M76 80 C238 54 352 65 496 82 M1090 67 C1264 51 1395 61 1524 91" class="soft-line" opacity="0.32"/>

  <text x="800" y="70" text-anchor="middle" font-size="39" font-weight="800" letter-spacing="2">Skill、MCP、Plugin 到底有什么不同？</text>
  <text x="800" y="105" text-anchor="middle" font-size="18" fill="#64716B">从“怎么做”，到“怎么连接”，再到“怎么交付”</text>

  <!-- top flow -->
  <g>
    <rect x="320" y="128" width="220" height="52" rx="12" fill="#DDEDE2" stroke="#4F7D68" stroke-width="2.5"/>
    <text x="430" y="161" text-anchor="middle" font-size="19" font-weight="700">把方法讲清楚</text>
    <path d="M552 154 C612 146 657 146 714 154" fill="none" stroke="#4F7D68" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
    <rect x="720" y="128" width="220" height="52" rx="12" fill="#F4E8BD" stroke="#A57A28" stroke-width="2.5"/>
    <text x="830" y="161" text-anchor="middle" font-size="19" font-weight="700">把能力连接起来</text>
    <path d="M952 154 C1012 146 1057 146 1114 154" fill="none" stroke="#A57A28" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowOchre)"/>
    <rect x="1120" y="128" width="220" height="52" rx="12" fill="#F2D9D5" stroke="#A85E57" stroke-width="2.5"/>
    <text x="1230" y="161" text-anchor="middle" font-size="19" font-weight="700">把能力交付出去</text>
  </g>

  <!-- phones -->
  <g filter="url(#softShadow)">
    <!-- Skill -->
    <g>
      <path d="M106 228 Q106 207 128 205 L485 208 Q507 208 506 231 L503 683 Q503 704 480 706 L126 703 Q104 703 105 680 Z" fill="#FFFDFC" stroke="#33413B" stroke-width="3.2"/>
      <path d="M240 223 Q305 216 370 224" class="hand"/>
      <circle cx="304" cy="692" r="5" fill="#92A098"/>
      <rect x="127" y="243" width="357" height="424" rx="10" fill="#F0F7F2"/>
      <path d="M128 314 C232 320 375 306 483 315" fill="none" stroke="#79A58B" stroke-width="2"/>
      <circle cx="164" cy="279" r="22" fill="#D5E9DA" stroke="#4F7D68" stroke-width="2.5"/>
      <path d="M154 279 l7 7 14 -16" fill="none" stroke="#4F7D68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="200" y="288" font-size="31" font-weight="800">Skill</text>
      <text x="151" y="351" class="label" fill="#4F7D68">核心问题</text>
      <text x="151" y="384" font-size="23" font-weight="750">这件事应该怎么做？</text>
      <path d="M150 406 C252 399 359 413 460 404" class="soft-line"/>
      <text x="151" y="442" class="label" fill="#4F7D68">主要内容</text>
      <text x="151" y="476" class="body"><tspan x="151">指令 · 步骤 · 判断标准</tspan><tspan x="151" dy="30">模板 · 脚本 · 参考资料</tspan></text>
      <text x="151" y="559" class="label" fill="#4F7D68">典型使用者</text>
      <rect x="151" y="578" width="124" height="36" rx="10" fill="#DDEDE2"/><text x="213" y="602" text-anchor="middle" class="small">Agent</text>
      <rect x="286" y="578" width="160" height="36" rx="10" fill="#DDEDE2"/><text x="366" y="602" text-anchor="middle" class="small">流程设计者</text>
      <text x="151" y="645" class="small">关键词：方法与执行规范</text>
    </g>

    <!-- MCP -->
    <g>
      <path d="M548 230 Q548 208 570 207 L928 205 Q950 206 949 229 L952 681 Q952 704 929 705 L572 706 Q550 705 550 682 Z" fill="#FFFDFC" stroke="#33413B" stroke-width="3.2"/>
      <path d="M686 223 Q750 216 815 223" class="hand"/>
      <circle cx="750" cy="692" r="5" fill="#92A098"/>
      <rect x="570" y="243" width="359" height="424" rx="10" fill="#FBF6E6"/>
      <path d="M571 314 C676 306 820 320 928 313" fill="none" stroke="#C9A34E" stroke-width="2"/>
      <circle cx="607" cy="279" r="22" fill="#F1E2AB" stroke="#A57A28" stroke-width="2.5"/>
      <path d="M597 285 C605 269 614 270 621 282 M602 277 L612 289" fill="none" stroke="#A57A28" stroke-width="3" stroke-linecap="round"/>
      <text x="644" y="288" font-size="31" font-weight="800">MCP</text>
      <text x="594" y="351" class="label" fill="#A57A28">核心问题</text>
      <text x="594" y="382" font-size="22" font-weight="750"><tspan x="594">Agent 如何发现并调用</tspan><tspan x="594" dy="28">外部能力？</tspan></text>
      <path d="M593 428 C700 419 811 434 905 424" class="soft-line"/>
      <text x="594" y="461" class="label" fill="#A57A28">主要内容</text>
      <text x="594" y="494" class="body"><tspan x="594">客户端 ↔ 服务器通信</tspan><tspan x="594" dy="29">能力协商 · Tools</tspan><tspan x="594" dy="29">Resources · Prompts</tspan></text>
      <text x="594" y="597" class="label" fill="#A57A28">典型使用者</text>
      <text x="594" y="628" class="small">Agent 宿主 · 工具开发者</text>
    </g>

    <!-- Plugin -->
    <g>
      <path d="M993 229 Q993 207 1015 206 L1372 208 Q1394 208 1393 231 L1395 681 Q1395 704 1372 706 L1016 704 Q994 704 995 681 Z" fill="#FFFDFC" stroke="#33413B" stroke-width="3.2"/>
      <path d="M1131 223 Q1195 216 1260 224" class="hand"/>
      <circle cx="1195" cy="692" r="5" fill="#92A098"/>
      <rect x="1016" y="243" width="357" height="424" rx="10" fill="#FAEFED"/>
      <path d="M1017 314 C1122 320 1264 305 1372 315" fill="none" stroke="#C9857E" stroke-width="2"/>
      <circle cx="1053" cy="279" r="22" fill="#F0D2CE" stroke="#A85E57" stroke-width="2.5"/>
      <path d="M1045 271 h16 v16 h-16 z M1049 267 v4 M1057 267 v4" fill="none" stroke="#A85E57" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1090" y="288" font-size="31" font-weight="800">Plugin</text>
      <text x="1040" y="351" class="label" fill="#A85E57">核心问题</text>
      <text x="1040" y="384" font-size="23" font-weight="750">怎样把一类能力交付给用户？</text>
      <path d="M1039 406 C1144 399 1262 413 1350 404" class="soft-line"/>
      <text x="1040" y="442" class="label" fill="#A85E57">主要内容</text>
      <text x="1040" y="475" class="body"><tspan x="1040">一个或多个 Skill</tspan><tspan x="1040" dy="29">以及 App、MCP 集成</tspan><tspan x="1040" dy="29">或配置模板</tspan></text>
      <text x="1040" y="578" class="label" fill="#A85E57">典型使用者</text>
      <text x="1040" y="609" class="small"><tspan x="1040">最终用户 · 管理员</tspan><tspan x="1040" dy="25">能力发布者</tspan></text>
    </g>
  </g>

  <!-- unified safety / capability module -->
  <g>
    <path d="M102 747 Q102 725 126 725 L1475 727 Q1498 727 1497 751 L1494 840 Q1494 862 1471 861 L126 860 Q103 860 104 837 Z" fill="#FFFDFC" stroke="#33413B" stroke-width="3"/>
    <path d="M393 727 C387 774 394 815 390 859 M1016 727 C1011 769 1018 817 1013 860" class="soft-line"/>
    <g transform="translate(140 757)">
      <path d="M25 0 L46 8 V25 C46 42 36 53 25 59 C14 53 4 42 4 25 V8 Z" fill="#E9EFEA" stroke="#33413B" stroke-width="2.5"/>
      <path d="M15 27 l7 7 14 -17" class="hand"/>
      <text x="72" y="25" font-size="23" font-weight="800">安全 / 能力边界</text>
      <text x="72" y="52" class="small">连接、权限与交付是三件事</text>
    </g>
    <g transform="translate(430 750)">
      <circle cx="30" cy="34" r="25" fill="#DDEDE2"/><text x="30" y="41" text-anchor="middle" font-size="24" font-weight="800" fill="#4F7D68">否</text>
      <text x="76" y="27" font-size="20" font-weight="800">Skill 不天然连接外部系统</text>
      <text x="76" y="56" class="small">它描述怎么做，本身不等于拥有工具或权限。</text>
    </g>
    <g transform="translate(1050 750)">
      <circle cx="30" cy="34" r="25" fill="#F1E2AB"/><text x="30" y="41" text-anchor="middle" font-size="22" font-weight="800" fill="#A57A28">是*</text>
      <text x="76" y="27" font-size="20" font-weight="800">MCP 天然面向外部连接</text>
      <text x="76" y="56" class="small">但连接 ≠ 授权；Plugin 也可能是纯 Skill、完全离线。</text>
    </g>
  </g>

  <text x="1485" y="887" text-anchor="end" font-size="13" fill="#7A857F">一图读懂 Agent 能力体系</text>
</svg>
